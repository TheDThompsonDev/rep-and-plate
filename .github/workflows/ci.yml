name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Local development runs Node 22.14; keep CI on the same major.
  NODE_VERSION: "22"

jobs:
  checks:
    name: Type, lint, unit, agents, native, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
            tools/typescript-eslint/package-lock.json

      - name: Install root dependencies
        run: npm ci

      # The root unit run also collects mobile/src tests, and mobile/tsconfig.json
      # extends expo/tsconfig.base, so Expo must be installed before vitest runs.
      - name: Install native dependencies
        run: npm --prefix mobile ci

      - name: Web type check
        run: npx tsc --noEmit

      # prelint installs tools/typescript-eslint (typescript-eslint on the
      # TypeScript 6 JS API; root tsc stays TypeScript 7) from its own lockfile.
      - name: Lint
        run: npm run lint

      - name: Unit tests (src + server)
        run: npx vitest run src server

      - name: Agent CLI/MCP suite
        run: npx vitest run scripts/agents

      - name: Agent contracts type check
        run: npm run agents:check

      - name: Native type check
        run: npm --prefix mobile run check

      - name: Native lint
        run: npm --prefix mobile run lint

      - name: Production build
        run: npm run build

  browser:
    name: Playwright browser suite
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # --with-deps asks Ubuntu's package mirror for extra fonts and libraries. Runners sometimes
      # cannot resolve that mirror, and apt then retries for ten minutes before failing the job
      # without running a test. The hosted image already carries Chromium's system libraries, so
      # give the full install three minutes and otherwise install the browser alone.
      - name: Install Chromium
        run: timeout 180 npx playwright install --with-deps chromium || npx playwright install chromium

      # playwright.config.ts starts `npm run dev` itself. The Vite dev server
      # hosts the API in-process with no provider keys, which is the
      # "provider unconfigured" state the specs expect; 42 of 55 specs also
      # mock their routes. tests/agent-connections.spec.ts starts its own
      # in-memory SQLite agent server and needs no environment either.
      - name: Browser tests (desktop + mobile projects)
        run: npx playwright test

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # The Expo app compiled for the browser. This suite was not in CI before, and a crash that
  # blanked the whole native app for returning users went unnoticed as a result.
  native-browser:
    name: Native web browser suite
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json

      # Playwright lives in the root package, and the native app imports shared code from ../src.
      - name: Install root dependencies
        run: npm ci

      - name: Install native dependencies
        run: npm --prefix mobile ci

      # --with-deps asks Ubuntu's package mirror for extra fonts and libraries. Runners sometimes
      # cannot resolve that mirror, and apt then retries for ten minutes before failing the job
      # without running a test. The hosted image already carries Chromium's system libraries, so
      # give the full install three minutes and otherwise install the browser alone.
      - name: Install Chromium
        run: timeout 180 npx playwright install --with-deps chromium || npx playwright install chromium

      # mobile/playwright.config.ts starts `expo start --web` itself and compiles the app once
      # before the first test. Every spec mocks its own routes; no environment is needed.
      - name: Native web tests
        working-directory: mobile
        run: node ../node_modules/@playwright/test/cli.js test

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-playwright-results
          path: mobile/test-results/
          retention-days: 7
