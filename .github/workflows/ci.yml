name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Local development runs Node 22.14; keep CI on the same major.
  NODE_VERSION: "22"

jobs:
  checks:
    name: Type, lint, unit, agents, native, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
            tools/typescript-eslint/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Web type check
        run: npx tsc --noEmit

      # prelint installs tools/typescript-eslint (typescript-eslint on the
      # TypeScript 6 JS API; root tsc stays TypeScript 7) from its own lockfile.
      - name: Lint
        run: npm run lint

      - name: Unit tests (src + server)
        run: npx vitest run src server

      - name: Agent CLI/MCP suite
        run: npx vitest run scripts/agents

      - name: Agent contracts type check
        run: npm run agents:check

      - name: Install native dependencies
        run: npm --prefix mobile ci

      - name: Native type check
        run: npm --prefix mobile run check

      - name: Native lint
        run: npm --prefix mobile run lint

      - name: Production build
        run: npm run build

  browser:
    name: Playwright browser suite
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # playwright.config.ts starts `npm run dev` itself. The Vite dev server
      # hosts the API in-process with no provider keys, which is the
      # "provider unconfigured" state the specs expect; 42 of 55 specs also
      # mock their routes. tests/agent-connections.spec.ts starts its own
      # in-memory SQLite agent server and needs no environment either.
      - name: Browser tests (desktop + mobile projects)
        run: npx playwright test

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
